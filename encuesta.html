<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Satisfacción</title>
    <link rel="stylesheet" href="css/estilos.css">
<body>
    <div class="contenedor-encuesta">
        <h1>ENCUESTA DE SATISFACCIÓN</h1>
        <p>Tus respuestas se guardan en la base de datos MySQL "encuesta"</p>

        <form action="conexion.php" method="POST" class="formulario">
            <div class="fila">
                <div class="grupo">
                    <label>Nombre</label>
                    <input type="text" name="nombre" placeholder="Tu nombre" required>
                </div>
                <div class="grupo">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Email" required>
                </div>
            </div>

            <div class="grupo">
                <label>Comentarios y sugerencias</label>
                <textarea name="opinion" rows="4" placeholder="Escribe aquí..."></textarea>
            </div>

            <button type="submit" class="boton-enviar">ENVIAR ENCUESTA</button>
        </form>
    </div>
</body>
</html>
